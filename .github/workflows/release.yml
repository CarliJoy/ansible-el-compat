name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # hatch-vcs needs full tag history

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Build Galaxy collection tarball
        run: uv run --group build hatch build --target galaxy dist/galaxy/

      - name: Smoke-test wheel
        run: >
          uv run --isolated --no-project
          --with dist/*.whl
          python -c "import ansible_collections.carlijoy.compat"

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: dist-galaxy
          path: dist/galaxy/
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Publish to PyPI via OIDC trusted publishing (no token needed)
  # Set up the trusted publisher at:
  #   https://pypi.org/manage/project/ansible-el-compat/settings/publishing/
  #   workflow: release.yml  |  environment: pypi
  # -------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ansible-el-compat/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Publish to PyPI
        run: uv publish

  # -------------------------------------------------------------------------
  # Publish the Ansible Galaxy collection tarball built in the build job
  # Requires secret: ANSIBLE_GALAXY_API_KEY
  # Obtain at: https://galaxy.ansible.com/me/preferences → API Key
  # -------------------------------------------------------------------------
  publish-galaxy:
    name: Publish to Ansible Galaxy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: galaxy
      url: https://galaxy.ansible.com/carlijoy/compat

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/download-artifact@v7
        with:
          name: dist-galaxy
          path: dist/galaxy/

      - name: Publish to Ansible Galaxy
        run: >
          uv run ansible-galaxy collection publish
          dist/galaxy/carlijoy-compat-*.tar.gz
          --api-key "${{ secrets.ANSIBLE_GALAXY_API_KEY }}"

  github-release:
    name: Sign distributions with Sigstore and upload to GitHub Release
    needs:
      - publish-pypi
      - publish-galaxy
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download Python dists
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Download Galaxy dists
        uses: actions/download-artifact@v7
        with:
          name: dist-galaxy
          path: dist/galaxy/

      - name: Sign all dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.2.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
            ./dist/galaxy/*.tar.gz

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ github.ref_name }}' \
            dist/*.tar.gz dist/*.whl dist/*.sigstore.json \
            dist/galaxy/*.tar.gz dist/galaxy/*.sigstore.json \
            --repo '${{ github.repository }}'
