name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Integration tests
    runs-on: ubuntu-latest
    # Docker is available on ubuntu-latest GitHub runners
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs needs full history to derive version from tags
          fetch-depth: 0

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install project + test deps
        run: uv sync --locked --no-default-groups --no-editable --group test

      - name: Run tests
        run: uv run pytest -v

  lint:
    name: prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.cache/prek
          key: prek-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install project + lint deps
        run: uv sync --locked --no-default-groups --no-editable --group lint

      - name: Run prek
        run: uv run prek run --all-files
